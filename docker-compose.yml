services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MEDIA_WORK_ROOT: /data
      MEDIA_CODEX_HOME: /auth/codex
      MEDIA_CLAUDE_HOME: /auth/claude
    ports:
      - '127.0.0.1:4000:4000'
    volumes:
      - media-data:/data
      - codex-auth:/auth/codex
      - claude-auth:/auth/claude
    stop_grace_period: 35s
volumes:
  media-data:
  codex-auth:
  claude-auth:
