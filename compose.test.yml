services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: media_ingest_test
    ports:
      - '127.0.0.1:54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 15
